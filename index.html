<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企画リサーチ</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0f0f;
      --panel: #1f1f1f;
      --panel2: #272727;
      --text: #f2f2f2;
      --muted: #aaa;
      --line: #3f3f3f;
      --accent: #ff4e45;
      --accent2: #3ea6ff;
      --warn: #d69e2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(15, 15, 15, .97);
      border-bottom: 1px solid var(--line);
      padding: 12px 18px 10px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }
    .searchbar {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto;
      gap: 8px;
      align-items: end;
      max-width: 920px;
    }
    .filters {
      display: grid;
      grid-template-columns: minmax(160px, .8fr) minmax(180px, 1fr) minmax(210px, 1.1fr) minmax(130px, .65fr) minmax(130px, .65fr) minmax(150px, .75fr) minmax(190px, .9fr);
      gap: 8px;
      align-items: end;
      margin-top: 10px;
    }
    .filters > label,
    .searchbar > label,
    .views-range {
      min-width: 0;
    }
    .filters input,
    .filters select,
    .searchbar input {
      width: 100%;
      min-width: 0;
    }
    label { color: var(--muted); font-size: 12px; display: grid; gap: 5px; }
    input, select, button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel2);
      color: var(--text);
      padding: 6px 10px;
      font: inherit;
    }
    input[type="search"] {
      border-radius: 18px;
      padding-left: 14px;
      background: #212121;
    }
    button {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
      border-radius: 18px;
      padding-inline: 18px;
    }
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      color: var(--text);
      align-items: center;
    }
    .filter-row label {
      display: inline-flex;
      grid-template-columns: none;
      gap: 6px;
      align-items: center;
      font-size: 13px;
      color: var(--text);
      min-height: 30px;
      padding: 4px 9px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #202020;
    }
    .filter-row input { min-height: auto; }
    .filter-group-label {
      color: var(--muted);
      font-size: 12px;
      margin-right: 2px;
    }
    .views-range {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .status {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
    }
    main { padding: 16px 18px 32px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(292px, 1fr));
      gap: 10px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      min-width: 0;
    }
    .card:hover { border-color: #686868; background: #242424; }
    .card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
      background: #111;
    }
    .meta { padding: 8px 9px 9px; display: grid; gap: 6px; }
    .primary-meta {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: baseline;
    }
    .channel-name {
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .view-count {
      color: var(--accent2);
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
    .metric {
      min-width: 0;
      padding: 5px 6px;
      border-radius: 6px;
      background: #181818;
      border: 1px solid #303030;
    }
    .metric-label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.1;
      margin-bottom: 3px;
    }
    .metric-value {
      display: block;
      color: var(--text);
      font-size: 12px;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .title {
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .badges { display: flex; gap: 4px; flex-wrap: wrap; }
    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 7px;
      color: var(--muted);
      font-size: 11px;
    }
    .badge.hit { color: #fff; border-color: var(--accent); background: rgba(56,161,105,.18); }
    .badge.warn { color: #fff; border-color: var(--warn); background: rgba(214,158,46,.18); }
    .badge.group { color: #fff; border-color: #4c8bf5; background: rgba(76,139,245,.18); }
    .badge.kando { color: #fff; border-color: #d56aa0; background: rgba(213,106,160,.2); }
    .badge.sukatto { color: #fff; border-color: #4db6ac; background: rgba(77,182,172,.2); }
    dialog {
      width: min(980px, calc(100vw - 28px));
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0;
      background: var(--panel);
      color: var(--text);
    }
    dialog::backdrop { background: rgba(0, 0, 0, .78); }
    .detail {
      display: grid;
      grid-template-columns: minmax(280px, 48%) 1fr;
      gap: 14px;
      padding: 14px;
    }
    .detail img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; }
    .detail h2 { margin: 0 0 8px; font-size: 18px; line-height: 1.45; }
    .kv { color: var(--muted); font-size: 12px; display: grid; gap: 4px; }
    .block { margin-top: 12px; }
    .block h3 { margin: 0 0 5px; font-size: 13px; color: var(--muted); }
    .text {
      white-space: pre-wrap;
      max-height: 180px;
      overflow: auto;
      background: #1a1a1a;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 8px;
      line-height: 1.55;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .actions a, .actions button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
    }
    @media (max-width: 760px) {
      .searchbar { grid-template-columns: 1fr; }
      .filters { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .filter-sort { grid-column: 1 / -1; }
      .detail { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>企画リサーチ</h1>
    <div class="searchbar">
      <label>検索語
        <input id="q" type="search" placeholder="例: 双子 ボロボロ 食堂">
      </label>
      <button id="searchBtn" type="button">キーワード検索</button>
    </div>
    <div class="filters">
      <label>系列
        <select id="channelGroup"></select>
      </label>
      <label>チャンネル
        <select id="channel"></select>
      </label>
      <label>視聴回数
        <div class="views-range">
          <input id="minViews" type="number" min="0" step="10000" placeholder="以上">
          <input id="maxViews" type="number" min="0" step="10000" placeholder="以下">
        </div>
      </label>
      <label>公開日以降
        <input id="dateFrom" type="date">
      </label>
      <label>公開日以前
        <input id="dateTo" type="date">
      </label>
      <label>サムネOCR
        <select id="thumbnailTextStatus">
          <option value="">すべて</option>
          <option value="ready">サムネ文字あり</option>
          <option value="missing">サムネ文字未整備</option>
        </select>
      </label>
      <label class="filter-sort">並び替え
        <select id="sort">
          <option value="date_desc" selected>公開日が新しい順</option>
          <option value="views_desc">視聴回数が多い順</option>
          <option value="likes_desc">高評価が多い順</option>
          <option value="comments_desc">コメントが多い順</option>
          <option value="like_rate_desc">高評価率が高い順</option>
          <option value="comment_rate_desc">コメント率が高い順</option>
          <option value="date_asc">公開日が古い順</option>
          <option value="relevance">関連度順</option>
        </select>
      </label>
    </div>
    <div class="filter-row">
      <span class="filter-group-label">ジャンル</span>
      <label><input type="checkbox" id="genreKando" checked> 感動</label>
      <label><input type="checkbox" id="genreSukatto"> スカッと</label>
    </div>
    <div class="filter-row">
      <span class="filter-group-label">検索対象</span>
      <label><input type="checkbox" id="fieldThumbnail" checked> サムネ文字</label>
      <label><input type="checkbox" id="fieldTitle" checked> タイトル</label>
      <label><input type="checkbox" id="fieldTags" checked> タグ</label>
      <label><input type="checkbox" id="matchAll" checked> すべての語を含む</label>
    </div>
    <div class="status" id="status"></div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <dialog id="dialog">
    <div class="detail">
      <div>
        <img id="detailImg" alt="">
        <div class="actions">
          <a id="youtubeLink" href="#" target="_blank" rel="noopener">YouTube</a>
          <button id="downloadCsvBtn" type="button">CSV DL</button>
          <button id="downloadThumbnailBtn" type="button">サムネDL</button>
          <button id="closeBtn" type="button">閉じる</button>
        </div>
      </div>
      <div>
        <h2 id="detailTitle"></h2>
        <div class="kv" id="detailMeta"></div>
        <div class="block">
          <h3>サムネ文字</h3>
          <div class="text" id="detailThumbnailText"></div>
        </div>
        <div class="block">
          <h3>冒頭ダイジェスト</h3>
          <div class="text" id="detailScriptText"></div>
        </div>
        <div class="block">
          <h3>サムネ分析</h3>
          <div class="text" id="detailThumbnailAnalysis"></div>
        </div>
        <div class="block">
          <h3>タグ</h3>
          <div class="badges" id="detailTags"></div>
        </div>
      </div>
    </div>
  </dialog>

  <script src="data/videos.js"></script>
  <script src="data/transcripts_light.js"></script>
  <script>
    const videos = window.VIDEO_DATA || [];
    const transcriptById = new Map((window.TRANSCRIPT_DATA || []).map(t => [t.video_id, t]));
    const grid = document.getElementById("grid");
    const status = document.getElementById("status");
    const channelSelect = document.getElementById("channel");
    const channelGroupSelect = document.getElementById("channelGroup");
    const fmt = new Intl.NumberFormat("ja-JP");

    function init() {
      const counts = new Map();
      const groupCounts = new Map();
      videos.forEach(v => counts.set(v.channel, (counts.get(v.channel) || 0) + 1));
      videos.forEach(v => {
        if (v.channel_group) groupCounts.set(v.channel_group, (groupCounts.get(v.channel_group) || 0) + 1);
      });
      const channels = [...counts.keys()].filter(Boolean).sort((a, b) => a.localeCompare(b, "ja"));
      const groups = [...groupCounts.keys()].sort((a, b) => a.localeCompare(b, "ja"));
      channelSelect.innerHTML = '<option value="">すべて</option>' + channels.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)} (${counts.get(c)})</option>`).join("");
      channelGroupSelect.innerHTML = '<option value="">すべて</option>' + groups.map(g => `<option value="${escapeAttr(g)}">${escapeHtml(g)} (${groupCounts.get(g)})</option>`).join("");
      document.getElementById("searchBtn").addEventListener("click", render);
      document.getElementById("q").addEventListener("input", debounce(render, 250));
      document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") render(); });
      document.querySelectorAll("select, input[type='date'], input[type='number'], input[type='checkbox']").forEach(el => {
        el.addEventListener("change", render);
      });
      document.querySelectorAll("input[type='date'], input[type='number']").forEach(el => {
        el.addEventListener("input", debounce(render, 250));
      });
      document.getElementById("closeBtn").addEventListener("click", () => document.getElementById("dialog").close());
      render();
    }

    function render() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      const terms = q.split(/\s+/).filter(Boolean);
      const fields = selectedFields();
      const matchAll = document.getElementById("matchAll").checked;
      const channel = channelSelect.value;
      const channelGroup = channelGroupSelect.value;
      const minViews = Number(document.getElementById("minViews").value || 0);
      const maxViews = Number(document.getElementById("maxViews").value || 0);
      const dateFrom = document.getElementById("dateFrom").value;
      const dateTo = document.getElementById("dateTo").value;
      const sort = document.getElementById("sort").value;
      const thumbnailTextStatus = document.getElementById("thumbnailTextStatus").value;
      const genreKando = document.getElementById("genreKando").checked;
      const genreSukatto = document.getElementById("genreSukatto").checked;

      let rows = videos.map(v => {
        const hit = hitInfo(v, terms, fields, matchAll);
        return { v, hit };
      }).filter(({ v, hit }) => {
        const genre = genreCategory(v);
        if (genre === "kando" && !genreKando) return false;
        if (genre === "sukatto" && !genreSukatto) return false;
        if (genre !== "kando" && genre !== "sukatto") return false;
        if (channelGroup && v.channel_group !== channelGroup) return false;
        if (channel && v.channel !== channel) return false;
        if ((v.view_count || 0) < minViews) return false;
        if (maxViews && (v.view_count || 0) > maxViews) return false;
        if (dateFrom && (!v.published_at || v.published_at.slice(0, 10) < dateFrom)) return false;
        if (dateTo && (!v.published_at || v.published_at.slice(0, 10) > dateTo)) return false;
        if (thumbnailTextStatus === "ready" && !(v.thumbnail_text || "").trim()) return false;
        if (thumbnailTextStatus === "missing" && (v.thumbnail_text || "").trim()) return false;
        if (terms.length && !hit.ok) return false;
        return true;
      });

      if (sort === "views_desc") rows.sort((a, b) => (b.v.view_count || 0) - (a.v.view_count || 0));
      if (sort === "likes_desc") rows.sort((a, b) => (b.v.like_count || 0) - (a.v.like_count || 0));
      if (sort === "comments_desc") rows.sort((a, b) => (b.v.comment_count || 0) - (a.v.comment_count || 0));
      if (sort === "like_rate_desc") rows.sort((a, b) => rateValue(b.v.like_count, b.v.view_count) - rateValue(a.v.like_count, a.v.view_count));
      if (sort === "comment_rate_desc") rows.sort((a, b) => rateValue(b.v.comment_count, b.v.view_count) - rateValue(a.v.comment_count, a.v.view_count));
      if (sort === "date_desc") rows.sort((a, b) => String(b.v.published_at).localeCompare(String(a.v.published_at)));
      if (sort === "date_asc") rows.sort((a, b) => String(a.v.published_at).localeCompare(String(b.v.published_at)));
      if (sort === "relevance") rows.sort((a, b) => b.hit.score - a.hit.score || (b.v.view_count || 0) - (a.v.view_count || 0));

      const limited = rows.slice(0, 500);
      status.textContent = `表示 ${fmt.format(limited.length)}件 / ヒット ${fmt.format(rows.length)}件 / 全 ${fmt.format(videos.length)}件`;
      grid.innerHTML = limited.map(({ v, hit }) => cardHtml(v, hit)).join("");
      grid.querySelectorAll(".card").forEach(el => {
        el.addEventListener("click", () => openDetail(videos[Number(el.dataset.idx)]));
      });
    }

    function selectedFields() {
      return {
        thumbnail: document.getElementById("fieldThumbnail").checked,
        title: document.getElementById("fieldTitle").checked,
        tags: document.getElementById("fieldTags").checked,
      };
    }

    function hitInfo(v, terms, fields, matchAll) {
      if (!terms.length) return { ok: true, score: 0, fields: [] };
      const texts = [];
      if (fields.thumbnail) texts.push(["サムネ文字", v.thumbnail_text || ""]);
      if (fields.title) texts.push(["タイトル", v.title || ""]);
      if (fields.tags) texts.push(["タグ", (v.tags || []).join(" ")]);
      const termHits = terms.map(term => {
        const hitFields = texts.filter(([, text]) => String(text).toLowerCase().includes(term)).map(([name]) => name);
        return hitFields;
      });
      const ok = matchAll ? termHits.every(x => x.length) : termHits.some(x => x.length);
      const fieldsHit = [...new Set(termHits.flat())];
      return { ok, score: fieldsHit.length + termHits.filter(x => x.length).length, fields: fieldsHit };
    }

    function cardHtml(v, hit) {
      const idx = videos.indexOf(v);
      const date = (v.published_at || "").slice(0, 10) || "日付なし";
      const genre = genreCategory(v);
      const genreBadge = genre
        ? `<span class="badge ${genre}">${genre === "kando" ? "感動" : "スカッと"}</span>`
        : "";
      const groupBadge = v.channel_group
        ? `<span class="badge group">${escapeHtml(v.channel_group)}</span>`
        : "";
      const badges = genreBadge + groupBadge + (hit.fields.length
        ? hit.fields.map(x => `<span class="badge hit">${escapeHtml(x)}</span>`).join("")
        : (v.thumbnail_text ? "" : '<span class="badge warn">サムネ文字未整備</span>'));
      return `<article class="card" data-idx="${idx}">
        <img src="${escapeAttr(preferredThumbnail(v))}" alt="" loading="lazy" onerror="fallbackImage(this, ${idx})">
        <div class="meta">
          <div class="primary-meta">
            <span class="channel-name">${escapeHtml(v.channel || "")}</span>
            <span class="view-count">${fmt.format(v.view_count || 0)} 回</span>
          </div>
          <div class="title">${escapeHtml(v.title || "")}</div>
          <div class="metrics">
            <div class="metric"><span class="metric-label">公開日</span><span class="metric-value">${date}</span></div>
            <div class="metric"><span class="metric-label">高評価</span><span class="metric-value">${fmt.format(v.like_count || 0)} / ${rateText(v.like_count, v.view_count)}</span></div>
            <div class="metric"><span class="metric-label">コメント</span><span class="metric-value">${fmt.format(v.comment_count || 0)} / ${rateText(v.comment_count, v.view_count)}</span></div>
          </div>
          <div class="badges">${badges}</div>
        </div>
      </article>`;
    }

    function openDetail(v) {
      const t = transcriptById.get(v.video_id);
      const detailImg = document.getElementById("detailImg");
      detailImg.dataset.idx = videos.indexOf(v);
      detailImg.src = preferredThumbnail(v);
      document.getElementById("detailTitle").textContent = v.title || "";
      document.getElementById("youtubeLink").href = v.youtube_url;
      document.getElementById("detailMeta").innerHTML = [
        `チャンネル: ${escapeHtml(v.channel || "")}`,
        `ジャンル: ${genreCategory(v) === "kando" ? "感動" : genreCategory(v) === "sukatto" ? "スカッと" : "参考"}`,
        ...(v.channel_group ? [`系列: ${escapeHtml(v.channel_group)}`] : []),
        `視聴回数: ${fmt.format(v.view_count || 0)} 回`,
        `高評価: ${fmt.format(v.like_count || 0)} / 高評価率 ${rateText(v.like_count, v.view_count)}`,
        `コメント: ${fmt.format(v.comment_count || 0)} / コメント率 ${rateText(v.comment_count, v.view_count)}`,
        `公開日: ${escapeHtml((v.published_at || "").slice(0, 10) || "日付なし")}`,
        `更新日: ${escapeHtml(formatDateTime(v.fetched_at) || "不明")}`
      ].map(x => `<div>${x}</div>`).join("");
      document.getElementById("detailThumbnailText").textContent = v.thumbnail_text || "未整備";
      document.getElementById("detailScriptText").textContent = t ? t.digest + (t.chars > t.digest.length ? `\n\n... (${fmt.format(t.chars)}文字中、冒頭${fmt.format(t.digest.length)}文字)` : "") : "未取得";
      document.getElementById("detailThumbnailAnalysis").textContent = formatThumbnailAnalysis(v.thumbnail_analysis);
      document.getElementById("detailTags").innerHTML = (v.tags || []).slice(0, 80).map(x => `<span class="badge">${escapeHtml(x)}</span>`).join("");
      document.getElementById("downloadCsvBtn").onclick = () => downloadCsv(v, t);
      document.getElementById("downloadThumbnailBtn").onclick = () => downloadThumbnail(v);
      document.getElementById("dialog").showModal();
    }

    function downloadCsv(v, t) {
      const row = [v.video_id, v.channel || "", genreCategory(v), v.genre_tag || "", v.channel_group || "", v.group_role || "", v.title || "", v.youtube_url, preferredThumbnail(v), v.published_at || "", v.fetched_at || "", v.view_count || 0, v.like_count || 0, v.comment_count || 0, rateText(v.like_count, v.view_count), rateText(v.comment_count, v.view_count), t ? t.digest : ""];
      const csv = ["video_id,channel,genre,genre_tag,channel_group,group_role,title,youtube_url,thumbnail_url,published_at,fetched_at,view_count,like_count,comment_count,like_rate,comment_rate,digest", row.map(csvCell).join(",")].join("\n");
      downloadBlob(`${downloadBaseName(v)}.csv`, csv, "text/csv;charset=utf-8");
    }

    function genreCategory(v) {
      const tag = String(v.genre_tag || "");
      if (tag.includes("感動スカッと")) return "sukatto";
      if (tag.includes("純感動")) return "kando";
      return "";
    }

    function rateValue(count, views) {
      return views ? (Number(count || 0) / Number(views || 0)) : 0;
    }

    function rateText(count, views) {
      return `${(rateValue(count, views) * 100).toFixed(2)}%`;
    }

    async function downloadThumbnail(v) {
      const url = preferredThumbnail(v);
      try {
        const res = await fetch(url, { mode: "cors" });
        if (!res.ok) throw new Error(String(res.status));
        const blob = await res.blob();
        const ext = blob.type.includes("png") ? "png" : "jpg";
        downloadBlob(`${downloadBaseName(v)}_thumbnail.${ext}`, blob, blob.type || "image/jpeg");
      } catch (e) {
        window.open(url || v.thumbnail_url, "_blank", "noopener");
      }
    }

    function preferredThumbnail(v) {
      return v.thumbnail_max_url || v.thumbnail_url || "";
    }

    function fallbackImage(img, idx) {
      const v = videos[idx];
      const urls = (v && v.thumbnail_fallback_urls ? v.thumbnail_fallback_urls : []).filter(Boolean);
      const current = img.src;
      const next = urls.find(url => !current.includes(url.split("/").pop()));
      if (next) img.src = next;
    }

    function downloadBlob(filename, body, type) {
      const blob = body instanceof Blob ? body : new Blob([body], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function csvCell(value) {
      return `"${String(value).replace(/"/g, '""')}"`;
    }

    function formatDateTime(value) {
      if (!value) return "";
      return String(value).replace("T", " ").replace("Z", "").slice(0, 19);
    }

    function formatThumbnailAnalysis(a) {
      if (!a) return "未整備";
      const rows = [
        ["主役", a.main_subject],
        ["人物", a.people],
        ["舞台", a.setting],
        ["構図", a.composition],
        ["感情訴求", a.emotion_appeal],
        ["フック", a.story_hook],
      ].filter(([, value]) => value);
      return rows.length ? rows.map(([k, v]) => `${k}: ${v}`).join("\n") : "未整備";
    }

    function downloadBaseName(v) {
      const title = sanitizeFilename(v.title || "").slice(0, 20) || "untitled";
      return `${v.video_id}_${title}`;
    }

    function sanitizeFilename(value) {
      return String(value)
        .replace(/[\\/:*?"<>|\r\n]/g, "")
        .replace(/\s+/g, "")
        .trim();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function escapeAttr(value) { return escapeHtml(value); }

    function debounce(fn, wait) {
      let timer = 0;
      return (...args) => {
        window.clearTimeout(timer);
        timer = window.setTimeout(() => fn(...args), wait);
      };
    }

    init();
  </script>
</body>
</html>
